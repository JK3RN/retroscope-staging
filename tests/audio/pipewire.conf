# Private PipeWire instance for tests/audio/smoke.sh: no ALSA/Bluetooth/camera
# access, only null sinks and a fake microphone (the default *source*).
context.properties = { core.daemon = true  core.name = pipewire-0  default.clock.rate = 48000  default.clock.allowed-rates = [ 48000 ] }
context.spa-libs = { audio.convert.* = audioconvert/libspa-audioconvert  support.* = support/libspa-support }
context.modules = [
  { name = libpipewire-module-protocol-native }
  { name = libpipewire-module-access }
  { name = libpipewire-module-metadata }
  { name = libpipewire-module-spa-node-factory }
  { name = libpipewire-module-client-node }
  { name = libpipewire-module-client-device }
  { name = libpipewire-module-adapter }
  { name = libpipewire-module-link-factory }
  { name = libpipewire-module-session-manager }
]
context.objects = [
  { factory = spa-node-factory args = { factory.name = support.node.driver node.name = Dummy-Driver priority.driver = 20000 } }
  { factory = adapter args = { factory.name = support.null-audio-sink node.name = rs_sink_a node.description = "RS Test Sink A" media.class = Audio/Sink audio.position = [ FL FR ] audio.rate = 48000 monitor.channel-volumes = true } }
  { factory = adapter args = { factory.name = support.null-audio-sink node.name = rs_sink_b node.description = "RS Test Sink B" media.class = Audio/Sink audio.position = [ FL FR ] audio.rate = 48000 } }
  { factory = adapter args = { factory.name = support.null-audio-sink node.name = rs_fake_mic node.description = "RS Fake Mic" media.class = Audio/Source/Virtual audio.position = [ FL FR ] audio.rate = 48000 } }
]
